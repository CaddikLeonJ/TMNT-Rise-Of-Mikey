<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mikey Sewer Brawl</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font-family:monospace;overscroll-behavior:none;touch-action:none}
body{display:flex;align-items:stretch;justify-content:center;position:fixed;inset:0}
#wrap{width:100%;height:100dvh;padding:max(6px,env(safe-area-inset-top)) 8px max(6px,env(safe-area-inset-bottom));box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden}
canvas{width:100%;height:auto;min-height:0;flex:1;object-fit:contain;image-rendering:pixelated;border:3px solid #555;background:#17151f;display:block;box-sizing:border-box;touch-action:none}
#buttons{display:flex;gap:8px;flex-wrap:nowrap;margin-top:6px;justify-content:center;flex:0 0 auto;touch-action:none}
button{font:700 clamp(13px,3.8vw,18px) monospace;padding:12px clamp(10px,3vw,18px);background:#292929;color:white;border:2px solid #777;border-radius:8px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#hint{display:none}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game" width="480" height="270"></canvas>
<div id="hint">Keyboard: A/D move · W jump · J attack · K special · R restart</div>
<div id="buttons">
<button data-key="left">◀</button><button data-key="right">▶</button>
<button data-key="jump">JUMP</button><button data-key="attack">ATTACK</button><button data-key="special">SPECIAL</button>
</div>
</div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d'); x.imageSmoothingEnabled=false;
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
const keys={left:false,right:false,jump:false,attack:false,special:false};
let p,enemies,pizza,fx,round,score,gameOver,win,spawnTimer;
function reset(){
 p={x:80,y:181,w:34,h:54,vx:0,vy:0,hp:100,max:100,xp:0,level:1,face:1,attack:0,special:0,on:false,walk:0};
 enemies=[];pizza=[];fx=[];round=1;score=0;gameOver=false;win=false;spawnTimer=0;spawnWave();
}
function spawnWave(){
 let n=round+1;
 for(let i=0;i<n;i++) enemies.push({x:270+i*55,y:187,w:30,h:48,hp:25+round*8,max:25+round*8,hit:0,cd:Math.random()*60,walk:Math.random()*20});
}
function bind(k,v){keys[k]=v}
document.querySelectorAll('button').forEach(b=>{
 let k=b.dataset.key;
 b.addEventListener('pointerdown',e=>{e.preventDefault();bind(k,true)});
 ['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,e=>{bind(k,false)}));
});
addEventListener('keydown',e=>{
 if(e.code==='KeyA'||e.code==='ArrowLeft')keys.left=true;
 if(e.code==='KeyD'||e.code==='ArrowRight')keys.right=true;
 if(e.code==='KeyW'||e.code==='ArrowUp'||e.code==='Space')keys.jump=true;
 if(e.code==='KeyJ')keys.attack=true;
 if(e.code==='KeyK')keys.special=true;
 if(e.code==='KeyR')reset();
});
addEventListener('keyup',e=>{
 if(e.code==='KeyA'||e.code==='ArrowLeft')keys.left=false;
 if(e.code==='KeyD'||e.code==='ArrowRight')keys.right=false;
 if(e.code==='KeyW'||e.code==='ArrowUp'||e.code==='Space')keys.jump=false;
 if(e.code==='KeyJ')keys.attack=false;
 if(e.code==='KeyK')keys.special=false;
});
function rect(a){return {x:a.x,y:a.y,w:a.w,h:a.h}}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function gainXP(n){
 p.xp+=n;
 let need=50+p.level*30;
 if(p.xp>=need){p.xp-=need;p.level++;p.max+=15;p.hp=p.max;fx.push({x:p.x,y:p.y-10,t:'LEVEL UP!',life:60})}
}
function attack(){
 if(p.attack>0)return;
 p.attack=18;
 let box={x:p.face>0?p.x+p.w:p.x-30,y:p.y+4,w:30,h:24};
 enemies.forEach(e=>{
   if(e.hp>0&&hit(box,e)){e.hp-=12+p.level*3;e.hit=8;gainXP(10);fx.push({x:e.x,y:e.y-8,t:'HIT',life:20})}
 });
}
function special(){
 if(p.special>0)return;
 p.special=90;
 enemies.forEach(e=>{if(e.hp>0&&Math.abs(e.x-p.x)<85){e.hp-=30+p.level*5;e.hit=10;gainXP(15)}})
 fx.push({x:p.x-30,y:p.y-10,t:'NUNCHAKU SPIN!',life:35});
}
function update(){
 if(gameOver||win)return;
 p.vx=(keys.right?2.3:0)-(keys.left?2.3:0);
 if(p.vx){p.face=p.vx>0?1:-1;p.walk+=Math.abs(p.vx)*.16}
 if(keys.jump&&p.on){p.vy=-6.5;p.on=false}
 p.vy+=.32;p.x+=p.vx;p.y+=p.vy;
 if(p.y>=181){p.y=181;p.vy=0;p.on=true}
 p.x=Math.max(12,Math.min(448,p.x));
 if(keys.attack)attack(); if(keys.special)special();
 if(p.attack>0)p.attack--;if(p.special>0)p.special--;
 enemies.forEach(e=>{
   if(e.hp<=0)return;
   e.hit=Math.max(0,e.hit-1);e.cd--;
   let d=p.x-e.x;
   if(Math.abs(d)>38){e.x+=Math.sign(d)*(.55+round*.07);e.walk+=.12;}
   else if(e.cd<=0){p.hp-=4+round;e.cd=55}
 });
 for(let i=enemies.length-1;i>=0;i--){
   let e=enemies[i];
   if(e.hp<=0){pizza.push({x:e.x,y:205,life:500});score+=100;enemies.splice(i,1)}
 }
 pizza.forEach(q=>{q.life--;if(hit(p,{x:q.x-8,y:q.y-8,w:16,h:16})){p.hp=Math.min(p.max,p.hp+20);gainXP(15);q.life=0}});
 pizza=pizza.filter(q=>q.life>0);
 fx.forEach(f=>{f.life--;f.y-=.3});fx=fx.filter(f=>f.life>0);
 if(enemies.length===0&&pizza.length===0){
   spawnTimer++; if(spawnTimer>50){spawnTimer=0;
     if(round<5){round++;spawnWave()}else{win=true}}
 }
 if(p.hp<=0)gameOver=true;
}
function draw(){
 x.fillStyle='#111';x.fillRect(0,0,480,270);
 // sewer background
 x.fillStyle='#252532';x.fillRect(0,0,480,205);
 x.fillStyle='#30303d'; for(let i=0;i<12;i++)x.fillRect(i*42,35+(i%2)*35,38,4);
 x.fillStyle='#1b1b24';x.fillRect(0,205,480,65);
 x.fillStyle='#41414d';for(let i=0;i<480;i+=32)x.fillRect(i,222,20,3);
 // pipes
 x.fillStyle='#56566a';x.fillRect(25,80,130,9);x.fillRect(145,80,9,70);x.fillRect(330,55,110,9);x.fillRect(330,55,9,70);
 // v0.1.1 larger 16-bit-style animated fighters
 function turtlePart(px,py,w,h,col){x.fillStyle=col;x.fillRect(Math.round(px),Math.round(py),w,h)}
 function pixelTurtle(){
   const X=Math.round(p.x),Y=Math.round(p.y),F=p.face;
   const attacking=p.attack>0, special=p.special>0;
   const af=attacking?Math.min(3,Math.floor((18-p.attack)/4.5)):0;
   const wf=Math.floor(p.walk)%4;
   const bob=(!attacking&&p.on&&Math.abs(p.vx)>.1)?[0,1,0,-1][wf]:0;
   const legA=(!p.on)?-3:(!attacking&&Math.abs(p.vx)>.1?[0,4,0,-4][wf]:0);
   const legB=(!p.on)?3:-legA;
   // shell/body, now roughly twice the old visual size
   turtlePart(X+7,Y+13+bob,24,29,'#244b31');
   turtlePart(X+10,Y+15+bob,18,25,'#6b3d20');
   turtlePart(X+9,Y+10+bob,22,28,'#397b48');
   turtlePart(X+11,Y+17+bob,18,20,'#d3a33e');
   turtlePart(X+14,Y+1+bob,16,15,'#5aa85c');
   turtlePart(X+12,Y+5+bob,21,6,'#f07b35');
   turtlePart(X+(F>0?25:15),Y+7+bob,3,3,'#111');
   // mask tails
   turtlePart(X+(F>0?8:30),Y+6+bob,7,3,'#f07b35');
   turtlePart(X+(F>0?5:33),Y+9+bob,8,3,'#e66528');
   // belt
   turtlePart(X+10,Y+34+bob,20,4,'#5b351f'); turtlePart(X+18,Y+34+bob,5,4,'#d6a442');
   // animated legs
   turtlePart(X+10+legA,Y+38,8,13,'#4d9654'); turtlePart(X+23+legB,Y+38,8,13,'#4d9654');
   turtlePart(X+7+legA,Y+49,12,5,'#2f713e'); turtlePart(X+22+legB,Y+49,12,5,'#2f713e');
   turtlePart(X+9+legA,Y+42,10,4,'#f07b35'); turtlePart(X+22+legB,Y+42,10,4,'#f07b35');
   // arms change through a real four-frame nunchaku swing
   if(attacking){
     const poses=[[-8,19,14,4,32,8],[-3,10,19,-8,35,-10],[18,7,31,2,43,10],[16,20,31,25,42,31]];
     const a=poses[af], sx=F>0?X+a[0]+20:X+14-a[0];
     turtlePart(F>0?X+a[0]+18:X+8-a[0],Y+a[1],12,6,'#4d9654');
     x.strokeStyle='#d7b46a';x.lineWidth=2;x.beginPath();x.moveTo(sx,Y+a[1]+2);x.lineTo(F>0?X+a[4]:X+34-a[4]+X,Y+a[5]);x.stroke();
     turtlePart(F>0?X+a[4]-2:X+34-a[4],Y+a[5]-6,5,14,'#a86b2b');
   }else{
     const arm=[0,2,0,-2][wf]||0;
     turtlePart(X+(F>0?28:2),Y+20+arm,9,7,'#4d9654');
     turtlePart(X+(F>0?3:27),Y+22-arm,9,7,'#4d9654');
     turtlePart(X+(F>0?31:1),Y+23+arm,7,4,'#f07b35');
   }
   if(special){
     const ang=(90-p.special)*.45;
     x.strokeStyle='#ffb13b';x.lineWidth=3;
     for(let i=0;i<2;i++){x.beginPath();x.arc(X+20,Y+24,25+i*7,ang+i,ang+2.2+i);x.stroke()}
   }
 }
 pixelTurtle();
 enemies.forEach(e=>{
   if(e.hp<=0)return;
   const X=Math.round(e.x),Y=Math.round(e.y),wf=Math.floor(e.walk)%4,b=[0,1,0,-1][wf];
   const flash=e.hit?'#fff':'#30343d';
   // larger, layered Foot soldier with walking legs/arms
   turtlePart(X+6,Y+9+b,20,26,flash);
   turtlePart(X+8,Y+3+b,17,13,e.hit?'#fff':'#3c414b');
   turtlePart(X+9,Y-3+b,15,9,e.hit?'#fff':'#c49a7c');
   turtlePart(X+6,Y-5+b,21,7,'#17191d');
   turtlePart(X+7,Y+2+b,20,5,'#8f2027');
   turtlePart(X+11,Y+3+b,3,2,'#eee');turtlePart(X+20,Y+3+b,3,2,'#eee');
   const step=[-3,2,3,-2][wf];
   turtlePart(X+7+step,Y+34,8,12,'#24272e');turtlePart(X+19-step,Y+34,8,12,'#24272e');
   turtlePart(X+4+step,Y+44,12,5,'#111');turtlePart(X+18-step,Y+44,12,5,'#111');
   turtlePart(X+1,Y+17-b,8,7,flash);turtlePart(X+25,Y+18+b,8,7,flash);
   x.fillStyle='#2a2a2a';x.fillRect(X,Y-13,30,3);
   x.fillStyle='#7ee08a';x.fillRect(X,Y-13,30*(Math.max(0,e.hp)/e.max),3);
 });
 pizza.forEach(q=>{x.fillStyle='#f5c542';x.beginPath();x.arc(q.x,q.y,8,0,7);x.fill();x.fillStyle='#d84a4a';x.fillRect(q.x-3,q.y-3,3,3);x.fillRect(q.x+2,q.y,3,3)});
 fx.forEach(f=>{x.fillStyle='#fff';x.font='10px monospace';x.fillText(f.t,f.x,f.y)});
 // HUD
 x.fillStyle='#fff';x.font='12px monospace';x.fillText('MICHELANGELO',10,16);
 x.fillStyle='#612';x.fillRect(105,8,100,8);x.fillStyle='#e33';x.fillRect(105,8,100*Math.max(0,p.hp/p.max),8);
 x.fillStyle='#fff';x.fillText('LV '+p.level+'  XP '+p.xp,220,16);x.fillText('ROUND '+round+'/5',390,16);
 if(gameOver||win){
  x.fillStyle='rgba(0,0,0,.75)';x.fillRect(0,0,480,270);x.textAlign='center';
  x.font='22px monospace';x.fillStyle='#fff';x.fillText(win?'SHREDDER DEFEATED!':'MICKEY NEEDS PIZZA!',240,120);
  x.font='14px monospace';x.fillText(win?'You cleared the prototype!':'Press R to restart',240,150);x.textAlign='left';
 }
}
function loop(){update();draw();requestAnimationFrame(loop)}
reset();loop();
</script>
</body>
</html>
